<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Semua Lapak - Pasar Pintar</title>

<link rel="stylesheet"
      href="/marketplace-v1.1.css">

<link rel="stylesheet"
      href="/lapak-list.css?v=20260903-1">
</head>

<body>

<header class="directory-header">
  <div class="directory-header-inner">

    <a href="/"
       class="directory-back">
      ← Pasar Pintar
    </a>

    <div class="directory-market">
      Pasar Sederhana
    </div>

  </div>
</header>

<main class="directory-main">

  <section class="directory-hero">

    <div class="directory-logo">
      <img
        src="/logo-pasar-pintar.jpg"
        alt="Pasar Pintar">
    </div>

    <div>
      <div class="directory-eyebrow">
        Pasar Pintar
      </div>

      <h1>Lapak di Pasar Sederhana</h1>

      <p>
        Temukan pedagang dan belanja langsung
        dari lapak pilihan di pasar.
      </p>
    </div>

  </section>

  <section class="directory-search-section">

    <form id="storeSearchForm"
          class="directory-search">

      <input
        id="storeSearchInput"
        type="search"
        autocomplete="off"
        placeholder="Cari nama lapak...">

      <button type="submit">
        Cari
      </button>

    </form>

  </section>

  <section class="directory-list-section">

    <div class="directory-section-head">

      <div>
        <h2>Semua Lapak</h2>
        <p>
          Lapak aktif di Pasar Sederhana.
        </p>
      </div>

      <strong id="storeResultCount">
        ...
      </strong>

    </div>

    <div id="storeDirectoryGrid"
         class="directory-grid">

      <div class="directory-empty">
        Memuat lapak...
      </div>

    </div>

  </section>

</main>

<script src="/lapak-list.js?v=20260903-1"></script>

</body>
</html>
