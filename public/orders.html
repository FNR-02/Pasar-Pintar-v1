<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pesanan Saya - Pasar Pintar</title>
<link rel="stylesheet" href="/pasarpintar.css"><link rel="stylesheet" href="/customer-ui-v2.2.css">
<link rel="stylesheet" href="/marketplace-customer-nav.css">
<style>
.intro{padding-top:20px}.intro h1{margin:0 0 6px;font-size:30px;letter-spacing:-.03em}.intro p{margin:0;color:rgba(255,255,255,.76)}
.content{max-width:900px;margin:auto;padding:18px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.filter{border:1px solid var(--pp-border);background:#fff;color:#66717E;border-radius:999px;padding:8px 12px;white-space:nowrap}.filter.active{background:var(--pp-green);color:#fff;border-color:var(--pp-green)}
.order{margin-bottom:13px;overflow:hidden}.order-head{display:flex;justify-content:space-between;gap:10px;padding:15px;border-bottom:1px solid #EEF2F0}.order-code{font-size:14px;font-weight:850}.order-date{font-size:11px;color:var(--pp-muted);margin-top:3px}.items{padding:11px 15px}.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #E3E9E6}.item:last-child{border-bottom:0}.item strong{font-size:13px}.item small{display:block;color:var(--pp-muted);margin-top:3px}.foot{padding:14px 15px;background:#FBFCFB}.row{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px;color:var(--pp-muted)}.row strong{color:var(--pp-text);text-align:right}.total strong{font-size:18px;color:var(--pp-green)}.pay{width:100%;margin-top:8px}
.tracking{margin:0 15px 14px;padding:14px;border:1px solid #DDE8E2;background:#F6FAF8;border-radius:14px}.tracking-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.tracking-title strong{font-size:13px}.tracking-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:5px 0;color:var(--pp-muted)}.tracking-row strong{color:var(--pp-text);text-align:right;word-break:break-word}.tracking-note{margin-top:8px;padding-top:8px;border-top:1px dashed #D9E5DF;font-size:11px;line-height:1.5;color:var(--pp-muted)}
</style></head>
<body>
<div class="pp-shell">
<header class="pp-topbar"><div class="pp-wrap">
  <div class="pp-brand-row"><div class="pp-brand"><img class="pp-logo" src="/logo-pasar-pintar.jpg"><div><div class="pp-brand-title">Pasar Pintar</div><div class="pp-brand-sub">Tradisi · Teknologi · Terpercaya</div></div></div><button class="pp-icon-btn" onclick="location.href='/'" aria-label="Kembali"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="intro"><h1>Pesanan Saya</h1><p>Pantau status dan lanjutkan pembayaran dengan mudah.</p></div>
</div></header>
<main class="content">
  <div class="filters">
    <button class="filter active" onclick="setFilter('ALL',this)">Semua</button>
    <button class="filter" onclick="setFilter('PENDING',this)">Menunggu Bayar</button>
    <button class="filter" onclick="setFilter('PAID',this)">Dibayar</button>
    <button class="filter" onclick="setFilter('PACKING',this)">Diproses</button>
    <button class="filter" onclick="setFilter('DISPATCHED',this)">Dikirim</button>
    <button class="filter" onclick="setFilter('DELIVERED',this)">Selesai</button>
  </div>
  <div id="orders"><div class="pp-empty">Memuat pesanan...</div></div>
</main>
<nav class="marketplace-bottom-nav">
  <button class="marketplace-bottom-item"
          onclick="location.href='/'">
    <img src="/assets/icons/nav-home.svg" alt="">
    <span>Beranda</span>
  </button>

  <button class="marketplace-bottom-item"
          onclick="location.href='/#categories'">
    <img src="/assets/icons/nav-category.svg" alt="">
    <span>Kategori</span>
  </button>

  <button class="marketplace-bottom-item"
          onclick="location.href='/?open=cart'">
    <img src="/assets/icons/nav-cart.svg" alt="">
    <span>Keranjang</span>
  </button>

  <button class="marketplace-bottom-item active">
    <img src="/assets/icons/nav-orders.svg" alt="">
    <span>Pesanan</span>
  </button>

  <button class="marketplace-bottom-item"
          onclick="location.href='/profile.html'">
    <img src="/assets/icons/nav-account.svg" alt="">
    <span>Akun</span>
  </button>
</nav></div>
<script>
const token=localStorage.getItem('token');let data=[],filter='ALL';
function rupiah(v){return Number(v||0).toLocaleString('id-ID')}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function packSizeSnapshotLabel(item){
 const rawValue=
  item?.pack_size_value_snapshot;

 const rawUnit=
  String(
   item?.pack_size_unit_snapshot || ''
  )
   .trim()
   .toUpperCase();

 if(
  rawValue===null ||
  rawValue===undefined ||
  rawValue==='' ||
  !rawUnit
 ){
  return '';
 }

 const numeric=
  Number(rawValue);

 if(
  !Number.isFinite(numeric) ||
  numeric<=0
 ){
  return '';
 }

 const value=
  Number.isInteger(numeric)
   ? String(numeric)
   : String(numeric)
      .replace(/0+$/,'')
      .replace(/\.$/,'');

 const labels={
  GRAM:'gram',
  KG:'kg',
  ML:'ml',
  LITER:'liter',
  PCS:'pcs'
 };

 return (
  value+' '+
  (
   labels[rawUnit] ||
   rawUnit.toLowerCase()
  )
 );
}

function logout(){localStorage.removeItem('token');location.href='/'}
function label(s){return({PENDING:'Menunggu Pembayaran',PAID:'Sudah Dibayar',PACKING:'Sedang Dikemas',DISPATCHED:'Dalam Pengiriman',DELIVERED:'Selesai',FAILED:'Gagal'})[s]||s}
function orderLabel(o){
 const isPickup=
  String(
   o.fulfillment_type || 'DELIVERY'
  ).toUpperCase()==='PICKUP';

 if(isPickup && o.status==='DISPATCHED'){
  return 'Siap Diambil';
 }

 if(isPickup && o.status==='DELIVERED'){
  return 'Sudah Diambil';
 }

 return label(o.status);
}
function cls(s){return({PENDING:'pending',PAID:'paid',PACKING:'packing',DISPATCHED:'shipped',DELIVERED:'delivered',FAILED:'failed'})[s]||'pending'}
function shipmentLabel(s){return({ASSIGNED:'Kurir Ditugaskan',PICKED_UP:'Paket Diambil Kurir',IN_TRANSIT:'Dalam Perjalanan',DELIVERED:'Sudah Diterima'})[s]||s||'-'}
function tracking(o){const s=o.shipment;if(!s)return'';return `<div class="tracking"><div class="tracking-title"><strong>Informasi Pengiriman</strong><span class="pp-badge ${s.shipping_status==='DELIVERED'?'delivered':'shipped'}">${esc(shipmentLabel(s.shipping_status))}</span></div><div class="tracking-row"><span>No. Resi</span><strong>${esc(s.tracking_number||'-')}</strong></div><div class="tracking-row"><span>Kurir</span><strong>${esc(s.courier_username||'-')}</strong></div>${s.updated_at?`<div class="tracking-row"><span>Diperbarui</span><strong>${dt(s.updated_at)}</strong></div>`:''}${s.notes?`<div class="tracking-note">${esc(s.notes)}</div>`:''}</div>`}
function dt(v){return new Date(v).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
async function load(){
 try{
  const headers={
   Authorization:'Bearer '+token
  };

  const [legacyRes,marketRes]=
   await Promise.all([
    fetch('/api/orders/my',{headers}),
    fetch('/api/market/orders/my',{headers})
   ]);

  if(
   [legacyRes.status,marketRes.status]
    .some(x=>x===401||x===403)
  ){
   logout();
   return;
  }

  const legacy=await legacyRes.json();
  const market=await marketRes.json();

  if(!legacyRes.ok)
   throw new Error(
    legacy.error||'Gagal memuat pesanan'
   );

  if(!marketRes.ok)
   throw new Error(
    market.error||'Gagal memuat pesanan pasar'
   );

  data=[
   ...(legacy.data||[]),
   ...(market.data||[])
  ].sort(
   (a,b)=>
    new Date(b.created_at)-
    new Date(a.created_at)
  );

  render();
 }catch(e){
  document.getElementById('orders').innerHTML=
   '<div class="pp-empty">'+
   esc(e.message)+
   '</div>';
 }
}

function customerStatus(o){
 if(o.order_type!=='MARKET'){
  return o.status;
 }

 if(
  o.status==='COLLECTING' ||
  o.status==='READY_FOR_DELIVERY'
 ){
  return 'PACKING';
 }

 if(o.status==='OUT_FOR_DELIVERY'){
  return 'DISPATCHED';
 }

 return o.status;
}

function marketOrderLabel(o){
 const s=customerStatus(o);

 if(
  s==='PENDING' &&
  o.payment_status==='UNPAID'
 ){
  return 'Menunggu Pembayaran';
 }

 return label(s);
}

function renderMarketOrder(o){
 const status=customerStatus(o);

 const paymentText=
  o.payment_status==='PAID'
   ? 'Sudah Dibayar'
   : 'Belum Dibayar';

 const payButton=
  (
   o.payment_status==='UNPAID' &&
   o.status==='PENDING' &&
   o.payment_id
  )
   ? `<button
        class="pp-btn pp-btn-primary pay"
        onclick="location.href=
         '/market-payment.html?payment='+
         encodeURIComponent('${o.payment_id}')">
        Bayar Sekarang
      </button>`
   : '';
 const cancelButton=(o.payment_status==='UNPAID'&&o.status==='PENDING')?`<button class="pp-btn pay" style="background:#fff;color:#B42318;border:1px solid #F0B7B2;margin-top:8px" onclick="cancelMarketOrder('${o.id}',this)">Batalkan Pesanan</button>`:'';

 return `
  <article class="pp-card order">

   <div class="order-head">
    <div>
     <div class="order-code">
      ${esc(o.market_name||'Pasar')}
      · #${String(o.id).slice(0,8).toUpperCase()}
     </div>
     <div class="order-date">
      ${dt(o.created_at)}
     </div>
    </div>

    <span class="pp-badge ${cls(status)}">
     ${esc(marketOrderLabel(o))}
    </span>
   </div>

   <div class="items">
    <div class="row">
     <span>Pesanan Gabungan</span>
     <strong>
      ${Number(o.merchant_count||0)} Jongko
      · ${(o.items||[]).length} Produk
     </strong>
    </div>

    ${(o.items||[]).map(i=>`
     <div class="item">
      <div>
       <strong>${esc(i.product_name||'Produk')}</strong>
       <small>
        ${esc(i.store_name||'Jongko')}
        · ${i.quantity}
        ${esc(
         String(
          i.selling_unit_snapshot||'PCS'
         ).toLowerCase()
        )}
        × Rp ${rupiah(i.unit_price)}
       </small>
      </div>

      <strong>
       Rp ${
        rupiah(
         Number(i.unit_price||0)*
         Number(i.quantity||0)
        )
       }
      </strong>
     </div>
    `).join('')}
   </div>

   <div class="foot">
    <div class="row">
     <span>Alamat</span>
     <strong>
      ${esc(o.shipping_address||'-')}
     </strong>
    </div>

    <div class="row">
     <span>Pembayaran</span>
     <strong>${paymentText}</strong>
    </div>

    <div class="row total">
     <span>Total</span>
     <strong>
      Rp ${rupiah(o.total_amount)}
     </strong>
    </div>

    ${payButton}
     ${cancelButton}
   </div>

  </article>
 `;
}
async function cancelMarketOrder(id,btn){if(confirm('Batalkan pesanan ini?')===false)return;const old=btn.textContent;btn.disabled=true;btn.textContent='Membatalkan...';try{const r=await fetch('/api/market/orders/'+encodeURIComponent(id)+'/cancel',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({reason:'Dibatalkan oleh pelanggan'})});if(r.status===401||r.status===403){logout();return}const d=await r.json();if(r.ok===false){if(d.result_status==='gateway_cancel_not_confirmed')throw new Error('Pembatalan belum dikonfirmasi gateway. Silakan coba lagi.');if(d.result_status==='payment_already_paid'||d.result_status==='gateway_already_paid')throw new Error('Pembayaran sudah berhasil. Pesanan tidak dapat dibatalkan langsung.');throw new Error(d.error||'Pesanan tidak dapat dibatalkan')}alert('Pesanan berhasil dibatalkan.');await load()}catch(e){alert(e.message);btn.disabled=false;btn.textContent=old}}

function render(){
 const list=
  filter==='ALL'
   ? data
   : data.filter(
      x=>customerStatus(x)===filter
     );

 const box=
  document.getElementById(
   'orders'
  );

 if(!list.length){
  box.innerHTML=
   '<div class="pp-empty">Belum ada pesanan pada status ini.</div>';
  return;
 }

 box.innerHTML=list.map(o=>{
   if(o.order_type==='MARKET'){
    return renderMarketOrder(o);
   }

  const isPickup=
   String(
    o.fulfillment_type ||
    'DELIVERY'
   ).toUpperCase()==='PICKUP';

  const payAtOutlet=
   o.payment_provider==='OUTLET' &&
   o.payment_method==='PAY_AT_OUTLET';

  const locationBlock=
   isPickup
    ? `
      <div class="row">
       <span>Pengambilan</span>
       <strong>Ambil di Outlet</strong>
      </div>
      <div class="row">
       <span>Lokasi</span>
       <strong>
        ${esc(
         o.pickup_location_snapshot ||
         '-'
        )}
       </strong>
      </div>
     `
    : `
      <div class="row">
       <span>Alamat</span>
       <strong>
        ${esc(
         o.shipping_address ||
         '-'
        )}
       </strong>
      </div>
     `;

  const paymentBlock=
   payAtOutlet
    ? `
      <div class="row">
       <span>Pembayaran</span>
       <strong>
        Bayar saat Ambil —
        ${
         o.payment_status==='PAID'
          ? 'Sudah Dibayar'
          : 'Belum Dibayar'
        }
       </strong>
      </div>
     `
    : '';

  let payButton='';

  if(
   o.status==='PENDING' &&
   !payAtOutlet
  ){
   payButton=`
    <button
     class="pp-btn pp-btn-primary pay"
     onclick="location.href=
      '/payment.html?order='+
      encodeURIComponent('${o.id}')">
     Bayar Sekarang
    </button>
   `;
  }

  return `
   <article class="pp-card order">

    <div class="order-head">
     <div>
      <div class="order-code">
       #${String(o.id).slice(0,8).toUpperCase()}
      </div>
      <div class="order-date">
       ${dt(o.created_at)}
      </div>
     </div>

     <span class="pp-badge ${cls(o.status)}">
      ${esc(orderLabel(o))}
     </span>
    </div>

    <div class="items">
     ${(o.items||[]).map(i=>`
      <div class="item">
       <div>
        <strong>
         ${esc(i.product_name||'Produk')}
        </strong>
        <small>
         ${i.quantity}
         ${esc(
          String(
           i.selling_unit_snapshot || 'PCS'
          ).toLowerCase()
         )}
         × Rp ${rupiah(i.unit_price)}
         ${
          packSizeSnapshotLabel(i)
           ? ` · Isi ${esc(
               packSizeSnapshotLabel(i)
              )}`
           : ''
         }
         · SKU ${esc(i.sku||'-')}
        </small>
       </div>
       <strong>
        Rp ${
         rupiah(
          Number(i.unit_price||0) *
          Number(i.quantity||0)
         )
        }
       </strong>
      </div>
     `).join('')}
    </div>

    ${tracking(o)}

    <div class="foot">

     ${locationBlock}

     ${paymentBlock}

     <div class="row total">
      <span>Total</span>
      <strong>
       Rp ${rupiah(o.total_amount)}
      </strong>
     </div>

     ${payButton}

    </div>

   </article>
  `;
 }).join('');
}

if(!token)logout();else load()
</script></body></html>
