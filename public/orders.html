<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pesanan Saya - Pasar Pintar</title>
<link rel="stylesheet" href="/pasarpintar.css"><link rel="stylesheet" href="/customer-ui-v2.2.css">
<style>
.intro{padding-top:20px}.intro h1{margin:0 0 6px;font-size:30px;letter-spacing:-.03em}.intro p{margin:0;color:rgba(255,255,255,.76)}
.content{max-width:900px;margin:auto;padding:18px}.filters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.filter{border:1px solid var(--pp-border);background:#fff;color:#66717E;border-radius:999px;padding:8px 12px;white-space:nowrap}.filter.active{background:var(--pp-green);color:#fff;border-color:var(--pp-green)}
.order{margin-bottom:13px;overflow:hidden}.order-head{display:flex;justify-content:space-between;gap:10px;padding:15px;border-bottom:1px solid #EEF2F0}.order-code{font-size:14px;font-weight:850}.order-date{font-size:11px;color:var(--pp-muted);margin-top:3px}.items{padding:11px 15px}.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #E3E9E6}.item:last-child{border-bottom:0}.item strong{font-size:13px}.item small{display:block;color:var(--pp-muted);margin-top:3px}.foot{padding:14px 15px;background:#FBFCFB}.row{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:12px;color:var(--pp-muted)}.row strong{color:var(--pp-text);text-align:right}.total strong{font-size:18px;color:var(--pp-green)}.pay{width:100%;margin-top:8px}
</style></head>
<body>
<div class="pp-shell">
<header class="pp-topbar"><div class="pp-wrap">
  <div class="pp-brand-row"><div class="pp-brand"><img class="pp-logo" src="/logo-pasar-pintar.jpg"><div><div class="pp-brand-title">Pasar Pintar</div><div class="pp-brand-sub">Tradisi · Teknologi · Terpercaya</div></div></div><button class="pp-icon-btn" onclick="location.href='/customer.html'">←</button></div>
  <div class="intro"><h1>Pesanan Saya</h1><p>Pantau status dan lanjutkan pembayaran dengan mudah.</p></div>
</div></header>
<main class="content">
  <div class="filters">
    <button class="filter active" onclick="setFilter('ALL',this)">Semua</button>
    <button class="filter" onclick="setFilter('PENDING',this)">Menunggu Bayar</button>
    <button class="filter" onclick="setFilter('PAID',this)">Dibayar</button>
    <button class="filter" onclick="setFilter('PACKING',this)">Diproses</button>
    <button class="filter" onclick="setFilter('SHIPPED',this)">Dikirim</button>
    <button class="filter" onclick="setFilter('DELIVERED',this)">Selesai</button>
  </div>
  <div id="orders"><div class="pp-empty">Memuat pesanan...</div></div>
</main>
<nav class="pp-bottom-nav">
  <button class="pp-nav" onclick="location.href='/customer.html'"><span class="ico">⌂</span>Beranda</button>
  <button class="pp-nav" onclick="location.href='/customer.html'"><span class="ico">⌕</span>Cari</button>
  <button class="pp-nav" onclick="location.href='/customer.html'"><span class="ico">🛒</span>Keranjang</button>
  <button class="pp-nav active"><span class="ico">▤</span>Pesanan</button>
  <button class="pp-nav" onclick="location.href='/profile.html'"><span class="ico">♙</span>Akun</button>
</nav></div>
<script>
const token=localStorage.getItem('token');let data=[],filter='ALL';
function rupiah(v){return Number(v||0).toLocaleString('id-ID')}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function logout(){localStorage.removeItem('token');location.href='/login.html'}
function label(s){return({PENDING:'Menunggu Pembayaran',PAID:'Sudah Dibayar',PACKING:'Sedang Diproses',SHIPPED:'Sedang Dikirim',DELIVERED:'Selesai',FAILED:'Gagal'})[s]||s}
function cls(s){return({PENDING:'pending',PAID:'paid',PACKING:'packing',SHIPPED:'shipped',DELIVERED:'delivered',FAILED:'failed'})[s]||'pending'}
function dt(v){return new Date(v).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function setFilter(f,el){filter=f;document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
async function load(){try{const r=await fetch('/api/orders/my',{headers:{Authorization:'Bearer '+token}});if(r.status===401||r.status===403){logout();return}const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal memuat pesanan');data=d.data||[];render()}catch(e){document.getElementById('orders').innerHTML='<div class="pp-empty">'+esc(e.message)+'</div>'}}
function render(){const list=filter==='ALL'?data:data.filter(x=>x.status===filter),box=document.getElementById('orders');if(!list.length){box.innerHTML='<div class="pp-empty">Belum ada pesanan pada status ini.</div>';return}box.innerHTML=list.map(o=>`<article class="pp-card order"><div class="order-head"><div><div class="order-code">#${String(o.id).slice(0,8).toUpperCase()}</div><div class="order-date">${dt(o.created_at)}</div></div><span class="pp-badge ${cls(o.status)}">${esc(label(o.status))}</span></div><div class="items">${(o.items||[]).map(i=>`<div class="item"><div><strong>${esc(i.product_name||'Produk')}</strong><small>${i.quantity} × Rp ${rupiah(i.unit_price)} · SKU ${esc(i.sku||'-')}</small></div><strong>Rp ${rupiah(Number(i.unit_price||0)*Number(i.quantity||0))}</strong></div>`).join('')}</div><div class="foot"><div class="row"><span>Alamat</span><strong>${esc(o.shipping_address||'-')}</strong></div><div class="row total"><span>Total</span><strong>Rp ${rupiah(o.total_amount)}</strong></div>${o.status==='PENDING'?`<button class="pp-btn pp-btn-primary pay" onclick="location.href='/payment.html?order=${encodeURIComponent(o.id)}'">Bayar Sekarang</button>`:''}</div></article>`).join('')}
if(!token)logout();else load()
</script></body></html>
