<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Warehouse & Logistics - Pasar Pintar</title>
<style>
body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:20px}
.wrap{max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
h1,h2{margin:0 0 10px}
.sub{color:#94a3b8}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:18px;margin-bottom:20px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:left;font-size:13px}
th{color:#cbd5e1}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#334155}
.safe{background:#14532d}.low{background:#854d0e}.critical{background:#991b1b}.delivered{background:#14532d}.assigned{background:#1d4ed8}
button{background:#dc2626;color:#fff;border:0;padding:9px 13px;border-radius:6px;cursor:pointer}
.error{color:#fca5a5;padding:10px 0}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 14px}
.stat strong{font-size:20px;display:block}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <div>
    <h1>🏭 Warehouse & Logistics Center</h1>
    <div class="sub">Monitoring stok dan pengiriman Pasar Pintar</div>
  </div>
  <button onclick="logout()">Keluar</button>
</div>

<section class="card">
  <h2>Live Inventory</h2>
  <div id="inventorySummary" class="summary"></div>

  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Produk</th>
        <th>Gudang</th>
        <th>Stok</th>
        <th>Minimum</th>
        <th>Maksimum</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="inventoryTable">
      <tr><td colspan="7">Memuat inventory...</td></tr>
    </tbody>
  </table>
</section>

<section class="card">
  <h2>Monitoring Pengiriman</h2>

  <table>
    <thead>
      <tr>
        <th>Tracking</th>
        <th>Customer</th>
        <th>Kurir</th>
        <th>Alamat</th>
        <th>Order</th>
        <th>Shipment</th>
        <th>Update</th>
      </tr>
    </thead>
    <tbody id="shipmentTable">
      <tr><td colspan="7">Memuat shipment...</td></tr>
    </tbody>
  </table>
</section>

<div id="error" class="error"></div>
</div>

<script>
const token=localStorage.getItem('token');

function esc(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function logout(){
  localStorage.removeItem('token');
  location.href='/login.html';
}

async function api(url){
  const r=await fetch(url,{
    headers:{Authorization:'Bearer '+token}
  });

  if(r.status===401||r.status===403){
    logout();
    throw new Error('Sesi berakhir');
  }

  const d=await r.json();

  if(!r.ok){
    throw new Error(d.error||d.message||'Request gagal');
  }

  return d;
}

function stockStatus(i){
  const stock=Number(i.quantity_on_hand||0);
  const min=Number(i.min_stock_level||0);

  if(stock<=0)return ['HABIS','critical'];
  if(stock<=min)return ['KRITIS','critical'];
  if(stock<=min+3)return ['RENDAH','low'];
  return ['AMAN','safe'];
}

async function loadInventory(){
  const d=await api('/api/warehouse/inventory');
  const items=d.inventory||[];

  let out=0,critical=0,low=0,normal=0;

  for(const i of items){
    const [label]=stockStatus(i);
    if(label==='HABIS')out++;
    else if(label==='KRITIS')critical++;
    else if(label==='RENDAH')low++;
    else normal++;
  }

  document.getElementById('inventorySummary').innerHTML=
    `<div class="stat"><strong>${items.length}</strong>Produk</div>`+
    `<div class="stat"><strong>${out}</strong>Habis</div>`+
    `<div class="stat"><strong>${critical}</strong>Kritis</div>`+
    `<div class="stat"><strong>${low}</strong>Rendah</div>`+
    `<div class="stat"><strong>${normal}</strong>Aman</div>`;

  document.getElementById('inventoryTable').innerHTML=
    items.length
    ? items.map(i=>{
        const [label,cls]=stockStatus(i);
        return `<tr>
          <td>${esc(i.sku||'-')}</td>
          <td>${esc(i.product_name||'-')}</td>
          <td>${esc(i.warehouse_name||'-')}</td>
          <td><strong>${Number(i.quantity_on_hand||0)}</strong></td>
          <td>${Number(i.min_stock_level||0)}</td>
          <td>${Number(i.max_stock_level||0)}</td>
          <td><span class="badge ${cls}">${label}</span></td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="7">Belum ada inventory.</td></tr>';
}

async function loadShipments(){
  const d=await api('/api/warehouse/shipments');
  const items=d.shipments||[];

  document.getElementById('shipmentTable').innerHTML=
    items.length
    ? items.map(s=>`<tr>
        <td>${esc(s.tracking_number||'-')}</td>
        <td>${esc(s.customer_name||'-')}</td>
        <td>${esc(s.courier_username||'-')}</td>
        <td>${esc(s.shipping_address||'-')}</td>
        <td><span class="badge">${esc(s.order_status||'-')}</span></td>
        <td><span class="badge ${s.shipping_status==='DELIVERED'?'delivered':'assigned'}">${esc(s.shipping_status||'-')}</span></td>
        <td>${s.updated_at?new Date(s.updated_at).toLocaleString('id-ID'):'-'}</td>
      </tr>`).join('')
    : '<tr><td colspan="7">Belum ada shipment.</td></tr>';
}

async function load(){
  try{
    await Promise.all([
      loadInventory(),
      loadShipments()
    ]);
  }catch(e){
    document.getElementById('error').textContent=e.message;
  }
}

if(!token)logout();
else load();
</script>
</body>
</html>
