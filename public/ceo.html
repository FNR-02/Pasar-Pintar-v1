<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEO Command Center - Pasar Pintar OS</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #334155; padding-bottom: 10px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        .card h3 { margin: 0 0 10px 0; color: #38bdf8; font-size: 16px; }
        .card p { font-size: 24px; font-weight: bold; margin: 0; color: #4ade80; }
        .logout-btn { background: #dc2626; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: auto; }
        .logout-btn:hover { background: #b91c1c; }
    </style>

<style>
/* Admin Operations launcher */
.operations-launcher{
    position:fixed;
    right:24px;
    bottom:104px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:11px;
    min-width:260px;
    padding:13px 16px;
    border-radius:14px;
    background:#0369a1;
    color:white;
    text-decoration:none;
    box-shadow:
        0 12px 30px rgba(0,0,0,.28);
}

.operations-launcher:hover{
    background:#075985;
}

.operations-launcher .icon{
    font-size:24px;
}

.operations-launcher .text{
    display:flex;
    flex-direction:column;
    font-weight:800;
}

.operations-launcher small{
    display:block;
    margin-top:3px;
    font-size:11px;
    line-height:1.3;
    font-weight:500;
    opacity:.85;
}

.onboarding-launcher{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:40;
    display:flex;
    align-items:center;
    gap:11px;
    min-height:54px;
    padding:0 18px;
    border:0;
    border-radius:16px;
    background:#0b7043;
    color:#fff;
    text-decoration:none;
    font-weight:800;
    box-shadow:
        0 12px 30px
        rgba(12,92,55,.25);
}
.onboarding-launcher:hover{
    background:#075d37;
}
.onboarding-launcher .icon{
    font-size:21px;
}
.onboarding-launcher .text{
    display:flex;
    flex-direction:column;
    line-height:1.2;
}
.onboarding-launcher small{
    color:#d4e9dc;
    font-size:10px;
    font-weight:600;
    margin-top:3px;
}
@media(max-width:600px){
    .operations-launcher{
        left:14px;
        right:14px;
        bottom:94px;
        justify-content:center;
    }

    .onboarding-launcher{
        left:14px;
        right:14px;
        bottom:14px;
        justify-content:center;
    }
}
</style>

</head>
<body>
    <div class="header">
        <h2>📊 CEO Command Center - Pasar Pintar OS</h2>
        <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Total Pendapatan</h3>
            <p id="totalRevenue">Rp 0</p>
        </div>
        <div class="card">
            <h3>Total Pesanan</h3>
            <p id="totalOrders">0</p>
        </div>
        <div class="card">
            <h3>Katalog Produk</h3>
            <p id="totalProducts">0</p>
        </div>
        <div class="card">
            <h3>Pengguna Aktif</h3>
            <p id="activeUsers">0</p>
        </div>
    </div>

    <script>
        const token =
            localStorage.getItem('token');

        /*
         * Canonical frontend role guard.
         * CEO/Admin workspace hanya role 4.
         */
        function requireWorkspaceRole(expectedRole) {
            try {
                if (!token) {
                    throw new Error('TOKEN_MISSING');
                }

                const payloadPart =
                    token.split('.')[1];

                if (!payloadPart) {
                    throw new Error('TOKEN_MALFORMED');
                }

                const payload =
                    JSON.parse(
                        window.atob(
                            payloadPart
                                .replace(/-/g, '+')
                                .replace(/_/g, '/')
                        )
                    );

                if (
                    payload.exp &&
                    Number(payload.exp) * 1000 <= Date.now()
                ) {
                    throw new Error('TOKEN_EXPIRED');
                }

                if (
                    Number(payload.role_id) !==
                    Number(expectedRole)
                ) {
                    throw new Error('ROLE_FORBIDDEN');
                }

                return payload;

            } catch (err) {
                localStorage.removeItem('token');
                window.location.replace(
                    '/login.html?reason=workspace_access'
                );
                return null;
            }
        }

        const sessionUser =
            requireWorkspaceRole(4);

        if (!sessionUser) {
            throw new Error(
                'ADMIN_WORKSPACE_ACCESS_BLOCKED'
            );
        }

        async function loadMetrics() {
            try {
                const res = await fetch('/api/metrics', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('totalRevenue').innerText = 'Rp ' + (data.revenue || 0).toLocaleString();
                    document.getElementById('totalOrders').innerText = data.orders || 0;
                    document.getElementById('totalProducts').innerText = data.products || 0;
                    document.getElementById('activeUsers').innerText = data.users || 0;
                }
            } catch (err) {
                console.error('Gagal memuat metrik CEO:', err);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        loadMetrics();
    </script>

<a
    class="operations-launcher"
    href="/admin-operations.html"
    aria-label="Buka Admin Operations"
>
    <span class="icon">⚙️</span>

    <span class="text">
        Operasional
        <small>
            Pantau pesanan, pembayaran, pengiriman, stok, dan tempo
        </small>
    </span>
</a>

<a
    class="onboarding-launcher"
    href="/admin-onboarding.html"
    aria-label="Buka Pendaftaran Seller dan Kurir"
>
    <span class="icon">👥</span>

    <span class="text">
        Pendaftaran Seller & Kurir
        <small>
            Review, setujui, atau tolak pendaftar
        </small>
    </span>
</a>

</body>
</html>
