<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasar Pintar</title>
  <meta name="robots" content="noindex">
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:#f8fafc;
    }
    .box{
      text-align:center;
      padding:28px;
    }
    .logo{
      font-size:42px;
      margin-bottom:12px;
    }
    h1{
      margin:0 0 8px;
      font-size:26px;
    }
    p{
      color:#94a3b8;
      margin:0;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">🛒</div>
    <h1>Pasar Pintar</h1>
    <p>Membuka layanan...</p>
  </div>

  <script>
    function go(path) {
      location.replace(path);
    }

    const token = localStorage.getItem('token');

    if (!token) {
      go('/login.html');
    } else {
      try {
        const payload = JSON.parse(
          atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
        );

        const role = Number(payload.role_id);

        if (role === 1) go('/customer.html');
        else if (role === 2) go('/merchant.html');
        else if (role === 3) go('/courier.html');
        else go('/ceo.html');
      } catch (err) {
        localStorage.removeItem('token');
        go('/login.html');
      }
    }
  </script>
</body>
</html>
