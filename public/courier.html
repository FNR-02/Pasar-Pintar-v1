<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kurir & Kolektor - Pasar Pintar</title>
<link rel="stylesheet" href="/customer-ui-v2.2.css">
<link rel="stylesheet" href="/courier-v4.css?v=20260912-1">
<style>
body{background:#f5f7f6}
.hero{background:linear-gradient(135deg,#075d37,#0b7545);color:#fff;padding:22px 18px 30px}
.wrap{max-width:900px;margin:auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:58px;height:58px;border-radius:15px;background:#fffaf0;padding:4px;object-fit:contain}
.brand h2{margin:0;font-size:24px}
.brand p{margin:4px 0 0;color:#cfe4d8}
.hero-title{margin-top:34px}
.hero-title small{color:#f1d184;font-weight:800}
.hero-title h1{font-size:34px;margin:12px 0 8px}
.hero-title p{margin:0;color:#d4e5dc;font-size:18px;line-height:1.4}
.main{padding:24px 18px 100px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat{background:#fff;border:1px solid #e3e9e6;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(24,50,39,.06)}
.stat span{display:block;color:#758091;margin-bottom:8px}
.stat strong{font-size:28px;color:#12613d}
.section-head{
 display:flex;
 justify-content:space-between;
 align-items:end;
 gap:12px;
 margin-bottom:16px
}
.section-head h2{margin:0;font-size:30px}
.section-head p{margin:6px 0 0;color:#758091}
.count{font-weight:800;color:#12613d}
.delivery{
 background:#fff;
 border:1px solid #e3e9e6;
 border-radius:22px;
 overflow:hidden;
 margin-bottom:18px;
 box-shadow:0 8px 24px rgba(24,50,39,.06)
}
.delivery-head{
 display:flex;
 justify-content:space-between;
 gap:12px;
 padding:18px 20px;
 border-bottom:1px solid #e3e9e6
}
.order-id{font-size:20px;font-weight:800}
.tracking{font-size:13px;color:#758091;margin-top:5px}
.badge{
 padding:7px 12px;
 border-radius:999px;
 font-size:12px;
 font-weight:800;
 height:max-content
}
.badge.ASSIGNED{background:#ddeaff;color:#2858a6}
.badge.DELIVERED{background:#e3f6eb;color:#17663e}
.delivery-body{padding:20px}
.info{
 display:flex;
 justify-content:space-between;
 gap:20px;
 margin-bottom:12px
}
.info span{color:#758091}
.info strong{text-align:right}
.total strong{font-size:22px;color:#12613d}
.complete{
 width:100%;
 margin-top:18px;
 min-height:50px;
 font-size:16px
}
.empty{
 background:#fff;
 border:1px dashed #cbd5d0;
 border-radius:20px;
 padding:35px 18px;
 text-align:center;
 color:#758091
}
.logout{
 margin-left:auto;
 width:46px;
 height:46px;
 border:1px solid rgba(255,255,255,.2);
 border-radius:14px;
 background:rgba(255,255,255,.1);
 color:#fff
}
@media(max-width:600px){
 .stats{grid-template-columns:repeat(3,1fr);gap:10px}
 .stat{padding:15px 12px}
 .stat strong{font-size:24px}
 .section-head h2{font-size:27px}
}

.delivery-card{
 background:#fff;
 border:1px solid #e3e9e6;
 border-radius:22px;
 overflow:hidden;
 margin-bottom:18px;
 box-shadow:0 8px 24px rgba(24,50,39,.06);
}

.status{
 display:inline-flex;
 align-items:center;
 padding:7px 12px;
 border-radius:999px;
 font-size:12px;
 font-weight:800;
 height:max-content;
}

.status.assigned{
 background:#ddeaff;
 color:#2858a6;
}

.status.delivered{
 background:#e3f6eb;
 color:#17663e;
}

.complete-btn{
 width:100%;
 min-height:52px;
 margin-top:18px;
 border:0;
 border-radius:14px;
 background:#0f613b;
 color:#fff;
 font-size:16px;
 font-weight:800;
 cursor:pointer;
}

.complete-btn:disabled{
 opacity:.65;
 cursor:not-allowed;
}

.done-note{
 margin-top:18px;
 padding:13px 15px;
 border-radius:14px;
 background:#edf8f2;
 color:#17663e;
 font-weight:700;
 text-align:center;
}


.stop-card{
 margin-top:14px;
 padding:16px;
 border:1px solid #e3e9e6;
 border-radius:16px;
 background:#f8faf9;
}
.stop-top{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:12px;
 margin-bottom:14px;
}
.stops{
 margin-top:18px;
 margin-bottom:18px;
}
.stop-card .complete-btn{
 margin-top:12px;
}
.status{
 background:#eef3f0;
 color:#345548;
}

</style>
</head>
<body>
<div class="hero">
 <div class="wrap">
  <div class="brand">
   <img class="logo" src="/logo-pasar-pintar.jpg">
   <div>
    <h2>Kurir Pasar Pintar</h2>
    <p>Pengambilan & Pengantaran</p>
   </div>
   <button
    class="logout"
    type="button"
    onclick="logout()"
    aria-label="Keluar dari akun">
    Keluar
   </button>
  </div>
  <div class="hero-title">
   <small>WORKSPACE KURIR</small>
   <h1>Tugas hari ini</h1>
   <p>
    Ambil dari merchant, satukan pesanan,
    lalu antar ke pelanggan.
   </p>
  </div>
 </div>
</div>

<main class="main">
 <div class="wrap">

  <div class="stats">
   <div class="stat">
    <span>Tersedia</span>
    <strong id="assignedCount">0</strong>
   </div>

   <div class="stat">
    <span>Aktif</span>
    <strong id="deliveredCount">0</strong>
   </div>

   <div class="stat">
    <span>Selesai</span>
    <strong id="totalCount">0</strong>
   </div>
  </div>

  <div class="section-head">
   <div>
    <h2>Daftar tugas</h2>
    <p>Pengambilan merchant dan pengantaran pelanggan.</p>
   </div>
   <div id="deliveryCount" class="count">
    0 tugas
   </div>
  </div>

  <div id="deliveries">
   <div class="empty">
    Memuat tugas Kurir & Kolektor...
   </div>
  </div>

 </div>
</main>

<div id="toast" class="pp-toast"></div>
<script>
const token=localStorage.getItem('token');

/*
 * Canonical frontend role guard.
 * Courier workspace hanya role 3.
 */
function requireWorkspaceRole(expectedRole){
 try{
  if(!token){
   throw new Error('TOKEN_MISSING');
  }

  const payloadPart=
   token.split('.')[1];

  if(!payloadPart){
   throw new Error('TOKEN_MALFORMED');
  }

  const payload=
   JSON.parse(
    window.atob(
     payloadPart
      .replace(/-/g,'+')
      .replace(/_/g,'/')
    )
   );

  if(
   payload.exp &&
   Number(payload.exp)*1000 <= Date.now()
  ){
   throw new Error('TOKEN_EXPIRED');
  }

  if(
   Number(payload.role_id) !==
   Number(expectedRole)
  ){
   throw new Error('ROLE_FORBIDDEN');
  }

  return payload;

 }catch(err){
  localStorage.removeItem('token');
  location.replace('/login.html?reason=workspace_access');
  return null;
 }
}

const sessionUser=
 requireWorkspaceRole(3);

if(!sessionUser){
 throw new Error(
  'COURIER_WORKSPACE_ACCESS_BLOCKED'
 );
}

let tasks=[];

const rupiah=v=>
 Number(v||0).toLocaleString('id-ID');

const esc=v=>String(v??'')
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;');

function shortId(id){
 return String(id||'')
  .slice(0,8)
  .toUpperCase();
}

function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;
 el.classList.add('show');
 setTimeout(
  ()=>el.classList.remove('show'),
  2800
 );
}

 const taskLabels={
  PENDING:'Tersedia',
  ASSIGNED:'Ditugaskan',
  COLLECTING:'Mengambil Barang',
  COLLECTED:'Siap Diantar',
  OUT_FOR_DELIVERY:'Dalam Pengantaran',
  RETURNING:'Pengembalian Barang',
  RETURNED:'Dikembalikan',
  COMPLETED:'Selesai',
  CANCELLED:'Dibatalkan'
 };

const stopLabels={
 PENDING:'Menunggu Merchant',
 READY:'Siap Diambil',
 ARRIVED:'Sudah Tiba',
 PICKED_UP:'Sudah Diambil',
 CANCELLED:'Dibatalkan'
};

function taskLabel(status){
 return taskLabels[status] || status || '-';
}

function stopLabel(status){
 return stopLabels[status] || status || '-';
}

async function api(path,options={}){
 const headers={
  ...(options.headers||{}),
  Authorization:'Bearer '+token
 };

 if(options.body){
  headers['Content-Type']='application/json';
 }

 const res=await fetch(
  '/api'+path,
  {
   ...options,
   headers
  }
 );

 if(res.status===401 || res.status===403){
  logout();
  throw new Error('Sesi berakhir');
 }

 const data=await res.json()
  .catch(()=>({}));

 if(!res.ok){
  throw new Error(
   data.error ||
   data.message ||
   'Permintaan gagal'
  );
 }

 return data;
}

function updateStats(){
 const available=tasks.filter(
  t=>t.is_available
 ).length;

 const active=tasks.filter(
  t=>t.is_mine &&
  [
   'ASSIGNED',
   'COLLECTING',
   'COLLECTED',
   'OUT_FOR_DELIVERY',
     'RETURNING'
  ].includes(t.status)
 ).length;

 const completed=tasks.filter(
  t=>t.is_mine &&
  t.status==='COMPLETED'
 ).length;

 const a=document.getElementById('assignedCount');
 const d=document.getElementById('deliveredCount');
 const total=document.getElementById('totalCount');
 const count=document.getElementById('deliveryCount');

 if(a) a.textContent=available;
 if(d) d.textContent=active;
 if(total) total.textContent=completed;
 if(count) count.textContent=tasks.length+' tugas';
}

function taskAction(task){
 if(task.is_available){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'assign'
    )">
    Ambil Tugas
   </button>
  `;
 }

 if(!task.is_mine){
  return '';
 }

 if(task.status==='ASSIGNED'){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'start'
    )">
    Mulai Pengambilan
   </button>
  `;
 }

 if(task.status==='COLLECTED'){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'start-delivery'
    )">
    Mulai Antar ke Pelanggan
   </button>
  `;
 }

  if(task.status==='OUT_FOR_DELIVERY'){
   const isCod=
    task.payment_method==='COD' &&
    task.payment_provider==='CASH';

   if(
    isCod &&
    task.payment_status==='UNPAID'
   ){
    return `
     <button
      class="complete-btn"
      onclick="runTaskAction(
       '${esc(task.id)}',
       'collect-cod-payment'
      )">
      Terima Uang COD
     </button>

     <button
      class="complete-btn"
      onclick="runCodDeliveryFailed(
       '${esc(task.id)}'
      )">
      Pesanan Ditolak / Gagal
     </button>
    `;
   }

   return `
    <button
     class="complete-btn"
     onclick="runTaskAction(
      '${esc(task.id)}',
      'complete-delivery'
     )">
     Selesaikan Pengiriman
    </button>
   `;
  }

  if(task.status==='RETURNING'){
   return `
    <button
     class="complete-btn"
     onclick="runTaskAction(
      '${esc(task.id)}',
      'complete-cod-return'
     )">
     Barang Sudah Kembali
    </button>
   `;
  }

  if(task.status==='RETURNED'){
   return `
    <div class="done-note">
     Pesanan COD telah dikembalikan
    </div>
   `;
  }

  if(task.status==='COMPLETED'){
   return `
    <div class="done-note">
     Pengiriman selesai
    </div>
   `;
  }

  return '';
 }

function stopAction(task,stop){
 if(
  !task.is_mine ||
  task.status!=='COLLECTING'
 ){
  return '';
 }

 if(stop.status==='READY'){
  return `
   <button
    class="complete-btn"
    onclick="runStopAction(
     '${esc(stop.id)}',
     'arrive'
    )">
    Tiba di Merchant
   </button>
  `;
 }

 if(stop.status==='ARRIVED'){
  return `
   <button
    class="complete-btn"
    onclick="runStopAction(
     '${esc(stop.id)}',
     'pickup'
    )">
    Barang Sudah Diambil
   </button>
  `;
 }

 return '';
}

function renderStops(task){
 const stops=Array.isArray(task.stops)
  ? task.stops
  : [];

 if(!stops.length){
  return `
   <div class="empty">
    Belum ada merchant stop.
   </div>
  `;
 }

 return stops.map(stop=>`
  <div class="stop-card">
   <div class="stop-top">
    <div>
     <strong>
      ${esc(stop.store_name||'Merchant')}
     </strong>
     <div class="tracking">
      Stop ${esc(stop.sequence_no||'-')}
     </div>
    </div>

    <span class="status">
     ${esc(stopLabel(stop.status))}
    </span>
   </div>

   <div class="info">
    <span>Alamat Merchant</span>
    <strong>
     ${esc(stop.merchant_address||'-')}
    </strong>
   </div>

   <div class="info">
    <span>Status Order</span>
    <strong>
     ${esc(stop.order_status||'-')}
    </strong>
   </div>

   ${stopAction(task,stop)}
  </div>
 `).join('');
}

function renderTasks(){
 const box=document.getElementById('deliveries');

 if(!tasks.length){
  box.innerHTML=`
   <div class="empty">
    Tidak ada tugas Kurir & Kolektor.
   </div>
  `;
  return;
 }

 box.innerHTML=tasks.map(task=>`
  <article class="delivery-card">

   <div class="delivery-head">
    <div>
     <div class="order-id">
      #${shortId(task.market_order_id||task.id)}
     </div>

     <div class="tracking">
      Task ${shortId(task.id)}
     </div>
    </div>

    <span class="status">
     ${esc(taskLabel(task.status))}
    </span>
   </div>

   <div class="delivery-body">

    <div class="info">
     <span>Pelanggan</span>
     <strong>
      ${task.is_mine ? esc(task.customer_name||'Pelanggan') : 'Detail pelanggan tersedia setelah tugas diambil.'}
     </strong>
    </div>

    <div class="info">
     <span>Status Marketplace</span>
     <strong>
      ${esc(task.market_order_status||'-')}
     </strong>
    </div>

    <div class="info">
     <span>Alamat Pengantaran</span>
     <strong>
      ${task.is_mine ? esc(task.shipping_address||'-') : 'Tersedia setelah tugas diambil.'}
     </strong>
    </div>

    <div class="info total">
     <span>Total Pesanan</span>
     <strong>
      Rp ${rupiah(task.total_amount)}
     </strong>
    </div>

    <div class="stops">
     ${renderStops(task)}
    </div>

    ${taskAction(task)}

   </div>
  </article>
 `).join('');
}

async function loadTasks(){
 const box=document.getElementById('deliveries');

 try{
  box.innerHTML=`
   <div class="empty">
    Memuat tugas Kurir & Kolektor...
   </div>
  `;

  const data=await api(
   '/collector-marketplace/v1/tasks'
  );

  tasks=Array.isArray(data.tasks)
   ? data.tasks
   : [];

  updateStats();
  renderTasks();

 }catch(err){
  console.error(err);

  box.innerHTML=`
   <div class="empty">
    ${esc(err.message)}
   </div>
  `;
 }
}

async function runTaskAction(taskId,action){
 const labels={
  assign:'Mengambil tugas...',
  start:'Memulai pengambilan...',
  'start-delivery':'Memulai pengantaran...',
    'collect-cod-payment':'Mencatat pembayaran COD...',
    'complete-cod-return':'Menyelesaikan pengembalian barang...',
  'complete-delivery':'Menyelesaikan pengiriman...'
 };

 toast(
  labels[action] ||
  'Memproses...'
 );

 try{
  await api(
   '/collector-marketplace/v1/tasks/' +
   encodeURIComponent(taskId) +
   '/' +
   action,
   {
    method:'POST'
   }
  );

  const success={
   assign:'Tugas berhasil diambil',
   start:'Pengambilan barang dimulai',
   'start-delivery':'Pengantaran ke pelanggan dimulai',
    'collect-cod-payment':'Pembayaran COD berhasil dicatat',
    'complete-cod-return':'Pengembalian barang berhasil diselesaikan',
   'complete-delivery':'Pengiriman berhasil diselesaikan'
  };

  toast(
   success[action] ||
   'Berhasil'
  );

  await loadTasks();

 }catch(err){
  console.error(err);
  toast(err.message);
 }
}

  async function runCodDeliveryFailed(taskId){
   const reason=prompt(
    'Alasan pesanan COD gagal atau ditolak pelanggan:'
   );

   if(reason===null){
    return;
   }

   const cleanReason=String(reason).trim();

   if(!cleanReason){
    toast('Alasan wajib diisi');
    return;
   }

   if(cleanReason.length>500){
    toast('Alasan maksimal 500 karakter');
    return;
   }

   if(!confirm(
    'Tandai pesanan COD gagal dan mulai pengembalian barang?'
   )){
    return;
   }

   toast('Mencatat kegagalan pengiriman COD...');

   try{
    await api(
     '/collector-marketplace/v1/tasks/' +
     encodeURIComponent(taskId) +
     '/mark-cod-delivery-failed',
     {
      method:'POST',
      body:JSON.stringify({
       reason:cleanReason
      })
     }
    );

    toast(
     'Pesanan masuk proses pengembalian barang'
    );

    await loadTasks();

   }catch(err){
    console.error(err);
    toast(err.message);
   }
  }

async function runStopAction(stopId,action){
 const labels={
  arrive:'Mencatat tiba di merchant...',
  pickup:'Mengonfirmasi barang diambil...'
 };

 toast(
  labels[action] ||
  'Memproses...'
 );

 try{
  await api(
   '/collector-marketplace/v1/stops/' +
   encodeURIComponent(stopId) +
   '/' +
   action,
   {
    method:'POST'
   }
  );

  const success={
   arrive:'Status tiba di merchant tersimpan',
   pickup:'Barang berhasil dikonfirmasi diambil'
  };

  toast(
   success[action] ||
   'Berhasil'
  );

  await loadTasks();

 }catch(err){
  console.error(err);
  toast(err.message);
 }
}

function logout(){
 localStorage.removeItem('token');
 location.href='/login.html';
}

loadTasks();

</script>

</body>
</html>
