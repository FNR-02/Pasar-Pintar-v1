<div id="toast" class="pp-toast"></div>
<script>
const token=localStorage.getItem('token');

/*
 * Canonical frontend role guard.
 * Courier workspace hanya role 3.
 */
function requireWorkspaceRole(expectedRole){
 try{
  if(!token){
   throw new Error('TOKEN_MISSING');
  }

  const payloadPart=
   token.split('.')[1];

  if(!payloadPart){
   throw new Error('TOKEN_MALFORMED');
  }

  const payload=
   JSON.parse(
    window.atob(
     payloadPart
      .replace(/-/g,'+')
      .replace(/_/g,'/')
    )
   );

  if(
   payload.exp &&
   Number(payload.exp)*1000 <= Date.now()
  ){
   throw new Error('TOKEN_EXPIRED');
  }

  if(
   Number(payload.role_id) !==
   Number(expectedRole)
  ){
   throw new Error('ROLE_FORBIDDEN');
  }

  return payload;

 }catch(err){
  localStorage.removeItem('token');
  location.replace('/login.html?reason=workspace_access');
  return null;
 }
}

const sessionUser=
 requireWorkspaceRole(3);

if(!sessionUser){
 throw new Error(
  'COURIER_WORKSPACE_ACCESS_BLOCKED'
 );
}

let tasks=[];

const rupiah=v=>
 Number(v||0).toLocaleString('id-ID');

const esc=v=>String(v??'')
 .replace(/&/g,'&amp;')
 .replace(/</g,'&lt;')
 .replace(/>/g,'&gt;')
 .replace(/"/g,'&quot;');

function shortId(id){
 return String(id||'')
  .slice(0,8)
  .toUpperCase();
}

function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;
 el.classList.add('show');
 setTimeout(
  ()=>el.classList.remove('show'),
  2800
 );
}

 const taskLabels={
  PENDING:'Tersedia',
  ASSIGNED:'Ditugaskan',
  COLLECTING:'Mengambil Barang',
  COLLECTED:'Siap Diantar',
  OUT_FOR_DELIVERY:'Dalam Pengantaran',
  RETURNING:'Pengembalian Barang',
  RETURNED:'Dikembalikan',
  COMPLETED:'Selesai',
  CANCELLED:'Dibatalkan'
 };

const stopLabels={
 PENDING:'Menunggu Merchant',
 READY:'Siap Diambil',
 ARRIVED:'Sudah Tiba',
 PICKED_UP:'Sudah Diambil',
 RETURNED:'Dikembalikan',
 CANCELLED:'Dibatalkan'
};

function taskLabel(status){
 return taskLabels[status] || status || '-';
}

function stopLabel(status){
 return stopLabels[status] || status || '-';
}

async function api(path,options={}){
 const headers={
  ...(options.headers||{}),
  Authorization:'Bearer '+token
 };

 if(options.body){
  headers['Content-Type']='application/json';
 }

 const res=await fetch(
  '/api'+path,
  {
   ...options,
   headers
  }
 );

 if(res.status===401 || res.status===403){
  logout();
  throw new Error('Sesi berakhir');
 }

 const data=await res.json()
  .catch(()=>({}));

 if(!res.ok){
  throw new Error(
   data.error ||
   data.message ||
   'Permintaan gagal'
  );
 }

 return data;
}

function updateStats(){
 const available=tasks.filter(
  t=>t.is_available
 ).length;

 const active=tasks.filter(
  t=>t.is_mine &&
  [
   'ASSIGNED',
   'COLLECTING',
   'COLLECTED',
   'OUT_FOR_DELIVERY',
     'RETURNING'
  ].includes(t.status)
 ).length;

 const completed=tasks.filter(
  t=>t.is_mine &&
  t.status==='COMPLETED'
 ).length;

 const a=document.getElementById('assignedCount');
 const d=document.getElementById('deliveredCount');
 const total=document.getElementById('totalCount');
 const count=document.getElementById('deliveryCount');

 if(a) a.textContent=available;
 if(d) d.textContent=active;
 if(total) total.textContent=completed;
 if(count) count.textContent=tasks.length+' tugas';
}

function taskAction(task){
 if(task.is_available){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'assign'
    )">
    Ambil Tugas
   </button>
  `;
 }

 if(!task.is_mine){
  return '';
 }

 if(task.status==='ASSIGNED'){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'start'
    )">
    Mulai Pengambilan
   </button>
  `;
 }

 if(task.status==='COLLECTED'){
  return `
   <button
    class="complete-btn"
    onclick="runTaskAction(
     '${esc(task.id)}',
     'start-delivery'
    )">
    Mulai Antar ke Pelanggan
   </button>
  `;
 }

  if(task.status==='OUT_FOR_DELIVERY'){
   const isCod=
    task.payment_method==='COD' &&
    task.payment_provider==='CASH';

   if(
    isCod &&
    task.payment_status==='UNPAID'
   ){
    return `
     <button
      class="complete-btn"
      onclick="runTaskAction(
       '${esc(task.id)}',
       'collect-cod-payment'
      )">
      Terima Uang COD
     </button>

     <button
      class="complete-btn"
      onclick="runCodDeliveryFailed(
       '${esc(task.id)}'
      )">
      Pesanan Ditolak / Gagal
     </button>
    `;
   }

   return `
    <button
     class="complete-btn"
     onclick="runTaskAction(
      '${esc(task.id)}',
      'complete-delivery'
     )">
     Selesaikan Pengiriman
    </button>
   `;
  }

  if(task.status==='RETURNING'){
   return `
    <button
     class="complete-btn"
     onclick="runTaskAction(
      '${esc(task.id)}',
      'complete-cod-return'
     )">
     Barang Sudah Kembali
    </button>
   `;
  }

  if(task.status==='RETURNED'){
   return `
    <div class="done-note">
     Pesanan COD telah dikembalikan
    </div>
   `;
  }

  if(task.status==='COMPLETED'){
   return `
    <div class="done-note">
     Pengiriman selesai
    </div>
   `;
  }

  return '';
 }

function stopAction(task,stop){
 if(
  !task.is_mine ||
  task.status!=='COLLECTING'
 ){
  return '';
 }

 if(stop.status==='READY'){
  return `
   <button
    class="complete-btn"
    onclick="runStopAction(
     '${esc(stop.id)}',
     'arrive'
    )">
    Tiba di Merchant
   </button>
  `;
 }

 if(stop.status==='ARRIVED'){
  return `
   <button
    class="complete-btn"
    onclick="runStopAction(
     '${esc(stop.id)}',
     'pickup'
    )">
    Barang Sudah Diambil
   </button>
  `;
 }

 return '';
}


function validCourierPoint(lat,lng){
 if(
  lat === null ||
  lat === undefined ||
  lng === null ||
  lng === undefined ||
  String(lat).trim() === "" ||
  String(lng).trim() === ""
 ){
  return false;
 }

 const latitude=Number(lat);
 const longitude=Number(lng);

 return (
  Number.isFinite(latitude) &&
  Number.isFinite(longitude) &&
  latitude >= -90 &&
  latitude <= 90 &&
  longitude >= -180 &&
  longitude <= 180
 );
}
function courierMapLink(lat,lng){
 if(!validCourierPoint(lat,lng)){
  return "";
 }

 const latitude=Number(lat);
 const longitude=Number(lng);

 return (
  "https://www.openstreetmap.org/" +
  "?mlat=" +
  encodeURIComponent(latitude) +
  "&mlon=" +
  encodeURIComponent(longitude) +
  "#map=18/" +
  encodeURIComponent(latitude) +
  "/" +
  encodeURIComponent(longitude)
 );
}

function courierRoutePoints(task){
 const points=[];

 const stops=Array.isArray(task.stops)
  ? [...task.stops]
  : [];

 stops.sort(
  (a,b)=>
   Number(a.sequence_no||9999) -
   Number(b.sequence_no||9999)
 );

 for(const stop of stops){
  if(
   validCourierPoint(
    stop.merchant_latitude,
    stop.merchant_longitude
   )
  ){
   points.push({
    type:"merchant",
    label:
     stop.store_name ||
     "Merchant",
    sequence:
     stop.sequence_no || "-",
    lat:Number(
     stop.merchant_latitude
    ),
    lng:Number(
     stop.merchant_longitude
    )
   });
  }
 }

 if(
  task.is_mine &&
  validCourierPoint(
   task.shipping_latitude,
   task.shipping_longitude
  )
 ){
  points.push({
   type:"customer",
   label:
    task.customer_name ||
    "Pelanggan",
   sequence:"Tujuan",
   lat:Number(
    task.shipping_latitude
   ),
   lng:Number(
    task.shipping_longitude
   )
  });
 }

 return points;
}

function renderCourierRoute(task){
 if(!task.is_mine){
  return "";
 }

 const points=courierRoutePoints(task);

 const taskKey=
  String(task.id||"")
   .replace(/[^a-zA-Z0-9_-]/g,"");

 if(!taskKey){
  return "";
 }

 const pointRows=points.map(
  (point,index)=>{
   const link=courierMapLink(
    point.lat,
    point.lng
   );

   return `
    <div class="route-point">
     <div class="route-number">
      ${index+1}
     </div>

     <div class="route-point-copy">
      <strong>
       ${esc(
        point.type==="customer"
         ? "Pelanggan"
         : point.label
       )}
      </strong>

      <span>
       ${
        point.type==="customer"
         ? "Tujuan pengantaran"
         : "Stop "+esc(point.sequence)
       }
      </span>

      ${
       link
        ? `
         <a
          class="map-link"
          href="${esc(link)}"
          target="_blank"
          rel="noopener noreferrer">
          Buka Peta
         </a>
        `
        : ""
      }
     </div>
    </div>
   `;
  }
 ).join("");

 return `
  <section class="route-card">
   <div class="route-title">
    <strong>Rute Tugas</strong>
    <span>
     ${points.length} titik
    </span>
   </div>

   ${
    points.length
     ? `
      <div
       id="courierRouteMap-${esc(taskKey)}"
       class="courier-route-map">
      </div>

      <div class="route-points">
       ${pointRows}
      </div>
     `
     : `
      <div class="location-missing">
       Belum ada titik lokasi yang dapat
       ditampilkan pada peta.
      </div>
     `
   }
  </section>
 `;
}

function initCourierRouteMaps(){
 if(
  !window.maplibregl ||
  !Array.isArray(tasks)
 ){
  return;
 }

 for(const task of tasks){
  if(!task.is_mine){
   continue;
  }

  const points=
   courierRoutePoints(task);

  if(!points.length){
   continue;
  }

  const taskKey=
   String(task.id||"")
    .replace(/[^a-zA-Z0-9_-]/g,"");

  const container=
   document.getElementById(
    "courierRouteMap-"+taskKey
   );

  if(
   !container ||
   container.dataset.mapReady==="1"
  ){
   continue;
  }

  container.dataset.mapReady="1";

  try{
   const map=
    new maplibregl.Map({
     container,
     style:{
      version:8,
      sources:{
       osm:{
        type:"raster",
        tiles:[
         "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        ],
        tileSize:256,
        attribution:
         "© OpenStreetMap contributors"
       }
      },
      layers:[
       {
        id:"osm",
        type:"raster",
        source:"osm"
       }
      ]
     },
     center:[
      points[0].lng,
      points[0].lat
     ],
     zoom:15
    });

   map.addControl(
    new maplibregl.NavigationControl({
     showCompass:false
    }),
    "top-right"
   );

   const bounds=
    new maplibregl.LngLatBounds();

   points.forEach(
    (point,index)=>{
     bounds.extend([
      point.lng,
      point.lat
     ]);

     const markerEl=
      document.createElement("div");

     markerEl.className=
      "route-number";

     markerEl.textContent=
      String(index+1);

     new maplibregl.Marker({
      element:markerEl
     })
      .setLngLat([
       point.lng,
       point.lat
      ])
      .setPopup(
       new maplibregl.Popup({
        offset:22
       }).setText(
        point.type==="customer"
         ? "Tujuan pelanggan"
         : (
          "Stop "+
          point.sequence+
          " - "+
          point.label
         )
       )
      )
      .addTo(map);
    }
   );

   if(points.length > 1){
    map.fitBounds(
     bounds,
     {
      padding:45,
      maxZoom:16,
      duration:0
     }
    );
   }

  }catch(err){
   console.error(
    "Gagal memuat peta task",
    task.id,
    err
   );

   container.innerHTML=
    '<div class="location-missing" '+
    'style="padding:16px">'+
    'Peta belum dapat dimuat.'+
    '</div>';
  }
 }
}

function renderStops(task){
 const stops=Array.isArray(task.stops)
  ? task.stops
  : [];

 if(!stops.length){
  return `
   <div class="empty">
    Belum ada merchant stop.
   </div>
  `;
 }

 return stops.map(stop=>{
  const hasPoint=
   validCourierPoint(
    stop.merchant_latitude,
    stop.merchant_longitude
   );

  const mapLink=
   hasPoint
    ? courierMapLink(
       stop.merchant_latitude,
       stop.merchant_longitude
      )
    : "";

  return `
   <div class="stop-card">
    <div class="stop-top">
     <div>
      <strong>
       ${esc(stop.store_name||'Merchant')}
      </strong>

      <div class="tracking">
       Stop ${esc(stop.sequence_no||'-')}
      </div>
     </div>

     <span class="status">
      ${esc(stopLabel(stop.status))}
     </span>
    </div>

    <div class="info">
     <span>Alamat Merchant</span>
     <strong>
      ${esc(stop.merchant_address||'-')}
     </strong>
    </div>

    <div class="info">
     <span>Status Order</span>
     <strong>
      ${esc(stop.order_status||'-')}
     </strong>
    </div>

    ${
     hasPoint
      ? `
       <div class="stop-location-detail">
        Pin lokasi outlet tersedia.
       </div>

       <a
        class="map-link"
        href="${esc(mapLink)}"
        target="_blank"
        rel="noopener noreferrer">
        Buka Peta Merchant
       </a>
      `
      : `
       <div class="location-missing">
        Pin lokasi merchant belum tersedia.
       </div>
      `
    }

    ${stopAction(task,stop)}
   </div>
  `;
 }).join('');
}

function renderTasks(){
 const box=document.getElementById('deliveries');

 if(!tasks.length){
  box.innerHTML=`
   <div class="empty">
    Tidak ada tugas Kurir & Kolektor.
   </div>
  `;
  return;
 }

 box.innerHTML=tasks.map(task=>`
  <article class="delivery-card">
   <div class="delivery-head">
    <div>
     <div class="order-id">
      #${shortId(task.market_order_id||task.id)}
     </div>

     <div class="tracking">
      Task ${shortId(task.id)}
     </div>
    </div>

    <span class="status">
     ${esc(taskLabel(task.status))}
    </span>
   </div>

   <div class="delivery-body">
    <div class="info">
     <span>Pelanggan</span>
     <strong>
      ${
       task.is_mine
        ? esc(
           task.customer_name ||
           'Pelanggan'
          )
        : 'Detail pelanggan tersedia setelah tugas diambil.'
      }
     </strong>
    </div>

    <div class="info">
     <span>Status Marketplace</span>
     <strong>
      ${esc(task.market_order_status||'-')}
     </strong>
    </div>

    <div class="info">
     <span>Alamat Pengantaran</span>
     <strong>
      ${
       task.is_mine
        ? esc(task.shipping_address||'-')
        : 'Tersedia setelah tugas diambil.'
      }
     </strong>
    </div>

    <div class="info total">
     <span>Total Pesanan</span>
     <strong>
      Rp ${rupiah(task.total_amount)}
     </strong>
    </div>

    ${renderCourierRoute(task)}

    <div class="stops">
     ${renderStops(task)}
    </div>

    ${taskAction(task)}
   </div>
  </article>
 `).join('');

 window.requestAnimationFrame(
  ()=>{
   initCourierRouteMaps();
  }
 );
}

async function loadTasks(){
 const box=document.getElementById('deliveries');

 try{
  box.innerHTML=`
   <div class="empty">
    Memuat tugas Kurir & Kolektor...
   </div>
  `;

  const data=await api(
   '/collector-marketplace/v1/tasks'
  );

  tasks=Array.isArray(data.tasks)
   ? data.tasks
   : [];

  updateStats();
  renderTasks();

 }catch(err){
  console.error(err);

  box.innerHTML=`
   <div class="empty">
    ${esc(err.message)}
   </div>
  `;
 }
}

async function runTaskAction(taskId,action){
 const labels={
  assign:'Mengambil tugas...',
  start:'Memulai pengambilan...',
  'start-delivery':'Memulai pengantaran...',
    'collect-cod-payment':'Mencatat pembayaran COD...',
    'complete-cod-return':'Menyelesaikan pengembalian barang...',
  'complete-delivery':'Menyelesaikan pengiriman...'
 };

 toast(
  labels[action] ||
  'Memproses...'
 );

 try{
  await api(
   '/collector-marketplace/v1/tasks/' +
   encodeURIComponent(taskId) +
   '/' +
   action,
   {
    method:'POST'
   }
  );

  const success={
   assign:'Tugas berhasil diambil',
   start:'Pengambilan barang dimulai',
   'start-delivery':'Pengantaran ke pelanggan dimulai',
    'collect-cod-payment':'Pembayaran COD berhasil dicatat',
    'complete-cod-return':'Pengembalian barang berhasil diselesaikan',
   'complete-delivery':'Pengiriman berhasil diselesaikan'
  };

  toast(
   success[action] ||
   'Berhasil'
  );

  await loadTasks();

 }catch(err){
  console.error(err);
  toast(err.message);
 }
}

  async function runCodDeliveryFailed(taskId){
   const reason=prompt(
    'Alasan pesanan COD gagal atau ditolak pelanggan:'
   );

   if(reason===null){
    return;
   }

   const cleanReason=String(reason).trim();

   if(!cleanReason){
    toast('Alasan wajib diisi');
    return;
   }

   if(cleanReason.length>500){
    toast('Alasan maksimal 500 karakter');
    return;
   }

   if(!confirm(
    'Tandai pesanan COD gagal dan mulai pengembalian barang?'
   )){
    return;
   }

   toast('Mencatat kegagalan pengiriman COD...');

   try{
    await api(
     '/collector-marketplace/v1/tasks/' +
     encodeURIComponent(taskId) +
     '/mark-cod-delivery-failed',
     {
      method:'POST',
      body:JSON.stringify({
       reason:cleanReason
      })
     }
    );

    toast(
     'Pesanan masuk proses pengembalian barang'
    );

    await loadTasks();

   }catch(err){
    console.error(err);
    toast(err.message);
   }
  }

async function runStopAction(stopId,action){
 const labels={
  arrive:'Mencatat tiba di merchant...',
  pickup:'Mengonfirmasi barang diambil...'
 };

 toast(
  labels[action] ||
  'Memproses...'
 );

 try{
  await api(
   '/collector-marketplace/v1/stops/' +
   encodeURIComponent(stopId) +
   '/' +
   action,
   {
    method:'POST'
   }
  );

  const success={
   arrive:'Status tiba di merchant tersimpan',
   pickup:'Barang berhasil dikonfirmasi diambil'
  };

  toast(
   success[action] ||
   'Berhasil'
  );

  await loadTasks();

 }catch(err){
  console.error(err);
  toast(err.message);
 }
}

function logout(){
 localStorage.removeItem('token');
 location.href='/login.html';
}

loadTasks();

</script>
